# T77 S1 (D-129): mỗi PR vào main và mỗi lần push main chạy đủ unit + e2e (trừ ca cách ly e2e/quarantine.json).
# Đỏ thì không merge. Repo cá nhân gói Free không khoá được nhánh — "chỉ merge khi xanh" là quy ước (CLAUDE.md).
name: test
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Kiểm tra cấu hình phân hệ
        run: node tools/codeowners.mjs --check
      - name: Unit
        run: npm run test:unit
      - name: E2E
        run: npx playwright test --reporter=github,html
        env:
          CI: '1'
      - name: Báo cáo e2e
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
